<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости — EduCMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f5f7fa;
            color: #1a1a2e;
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-logo {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo span {
            font-size: 28px;
            color: #4ade80;
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-nav {
            padding: 20px 0;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            padding: 0 20px;
            margin-bottom: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .nav-link.active {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border-left-color: #4ade80;
        }

        .nav-link span {
            font-size: 20px;
        }

        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 32px;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #6b7280;
            margin-top: 8px;
        }

        .breadcrumb a {
            color: #4ade80;
            text-decoration: none;
        }

        .breadcrumb span {
            font-size: 16px;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px 16px;
            flex: 1;
            max-width: 400px;
        }

        .search-box span {
            color: #9ca3af;
            font-size: 20px;
        }

        .search-box input {
            border: none;
            outline: none;
            font-size: 14px;
            flex: 1;
            font-family: inherit;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 222, 128, 0.3);
        }

        .btn-icon {
            padding: 8px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #6b7280;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-icon.delete:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .news-grid {
                grid-template-columns: 1fr;
            }
        }

        .news-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }

        .news-image {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 48px;
        }

        .news-content {
            padding: 20px;
        }

        .news-date {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .news-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .news-excerpt {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-actions {
            display: flex;
            gap: 8px;
        }

        .news-actions .btn-icon {
            padding: 8px 12px;
            font-size: 13px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-active {
            background: #f0fdf4;
            color: #22c55e;
        }

        .badge-draft {
            background: #fef3c7;
            color: #d97706;
        }

        .empty-state {
            grid-column: span 2;
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            border-radius: 16px;
        }

        @media (max-width: 1024px) {
            .empty-state {
                grid-column: span 1;
            }
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .empty-state-icon span {
            font-size: 40px;
            color: #9ca3af;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .empty-state-text {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 80px 16px 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .page-title {
                font-size: 24px;
            }

            .actions-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="/admin" class="sidebar-logo">
                <span class="material-icons-outlined">school</span>
                EduCMS
            </a>
            <div class="sidebar-subtitle">Панель управления</div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">Основное</div>
                <a href="/admin" class="nav-link">
                    <span class="material-icons-outlined">dashboard</span>
                    Дашборд
                </a>
                <a href="/admin/courses/" class="nav-link">
                    <span class="material-icons-outlined">auto_stories</span>
                    Курсы
                </a>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Контент</div>
                <a href="/admin/pages/" class="nav-link">
                    <span class="material-icons-outlined">article</span>
                    Страницы
                </a>
                <a href="/admin/news/" class="nav-link active">
                    <span class="material-icons-outlined">newspaper</span>
                    Новости
                </a>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Система</div>
                <a href="/admin/settings/" class="nav-link">
                    <span class="material-icons-outlined">settings</span>
                    Настройки
                </a>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1 class="page-title">Новости</h1>
                <div class="breadcrumb">
                    <a href="/admin">Главная</a>
                    <span class="material-icons-outlined">chevron_right</span>
                    <span>Новости</span>
                </div>
            </div>
        </header>

        <div class="actions-bar">
            <div class="search-box">
                <span class="material-icons-outlined">search</span>
                <input type="text" id="searchInput" placeholder="Поиск новостей...">
            </div>
            <a href="/admin/news/new/" class="btn btn-primary">
                <span class="material-icons-outlined">add</span>
                Добавить новость
            </a>
        </div>

        <div class="news-grid" id="newsGrid">
            <!-- News will be loaded dynamically -->
        </div>
    </main>

    <script src="../../../js/store-api.js"></script>
    <script src="../../../js/app.js"></script>
    <script>
        // Configure API URL for server
        window.__API_URL__ = 'http://172.17.140.100:5000/api';
        const api = new StoreAPI();
        
        document.addEventListener('DOMContentLoaded', async function() {
            await loadNews();

            document.getElementById('searchInput').addEventListener('input', async function(e) {
                await loadNews(e.target.value);
            });
        });

        async function loadNews(search = '') {
            try {
                const news = await api.getNews ? await api.getNews() : [];
                let filteredNews = news;

                if (search) {
                    const searchLower = search.toLowerCase();
                    filteredNews = news.filter(n =>
                        (n.title || '').toLowerCase().includes(searchLower) ||
                        (n.content || '').toLowerCase().includes(searchLower)
                    );
                }

                const grid = document.getElementById('newsGrid');

                if (filteredNews.length > 0) {
                    grid.innerHTML = filteredNews.map(item => `
                        <div class="news-card">
                            <div class="news-image">
                                <span class="material-icons-outlined">newspaper</span>
                            </div>
                            <div class="news-content">
                                <div class="news-date">${formatDate(item.created_at)}</div>
                                <h3 class="news-title">${item.title || 'Без названия'}</h3>
                                <p class="news-excerpt">${(item.content || '').substring(0, 100)}...</p>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                                    <span class="badge ${item.active ? 'badge-active' : 'badge-draft'}">${item.active ? 'Опубликована' : 'Черновик'}</span>
                                </div>
                                <div class="news-actions">
                                    <a href="/admin/news/edit/?id=${item.id}" class="btn-icon" title="Редактировать">
                                        <span class="material-icons-outlined">edit</span>
                                    </a>
                                    <button class="btn-icon delete" title="Удалить" onclick="deleteNews(${item.id}, api)">
                                        <span class="material-icons-outlined">delete</span>
                                    </button>
                                    <a href="/news/${item.alias}/" target="_blank" class="btn-icon" title="Просмотр">
                                        <span class="material-icons-outlined">open_in_new</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                <span class="material-icons-outlined">newspaper</span>
                            </div>
                            <div class="empty-state-title">Нет новостей</div>
                            <div class="empty-state-text">Добавьте первую новость, чтобы начать работу</div>
                            <a href="/admin/news/new/" class="btn btn-primary">
                                <span class="material-icons-outlined">add</span>
                                Добавить новость
                            </a>
                        </div>
                    `;
                }
            } catch (e) {
                console.error('Error loading news:', e);
                document.getElementById('newsGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-title">Ошибка загрузки новостей</div>
                        <div class="empty-state-text">Проверьте подключение к серверу</div>
                    </div>
                `;
            }
        }

        async function deleteNews(id, api) {
            if (EduApp.confirmAction('Вы уверены, что хотите удалить эту новость?')) {
                try {
                    await api.deleteNews(id);
                    await loadNews(api);
                } catch (e) {
                    console.error('Error deleting news:', e);
                    alert('Ошибка при удалении новости');
                }
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }
    </script>
</body>
</html>
